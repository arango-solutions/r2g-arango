name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check src/ tests/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # [all] installs the optional connectors so mypy sees their types.
      - run: pip install -e ".[all,dev]"
      - run: mypy src/r2g

  test:
    runs-on: ubuntu-latest
    strategy:
      # Keep every interpreter's result visible — a failure on one must not
      # cancel (and mask) the others.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        # [all] pulls in every optional connector/UI/MCP extra so the full test
        # suite can import them; [test] adds pytest/pytest-cov.
        # 3.12 ships no setuptools/pkg_resources; upgrade the build frontend so
        # pip resolves to modern binary wheels instead of building sdists.
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[all,test]"
      - name: Run tests with coverage
        run: >
          pytest tests/ --tb=short -m "not integration"
          --cov=r2g --cov-report=term-missing:skip-covered
          --cov-fail-under=80

  integration:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Start PostgreSQL + MySQL + SQL Server + ArangoDB + ClickHouse
        run: docker compose up -d --wait
      - name: Install dependencies
        # [dev] adds arangodb-schema-analyzer, the real analyzer the Forge
        # arango roundtrip runs (tests/integration/test_forge_roundtrip_arango.py).
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[all,test,dev]"
      - name: Run integration tests
        env:
          PG_CONN: postgresql://r2g:r2g_test_2026@localhost:5432/northwind
          MYSQL_CONN: mysql://r2g:r2g_test_2026@localhost:3306/shop
          MSSQL_CONN: mssql://sa:r2g_Test_2026!@localhost:1433/shop
          CLICKHOUSE_DSN: clickhouse://r2g:r2g_test_2026@localhost:8124/forge
          ARANGO_ENDPOINT: http://localhost:8540
          ARANGO_PASSWORD: r2g_test_2026
        run: pytest tests/integration/ -v -m integration
      - name: Tear down services
        if: always()
        run: docker compose down -v
